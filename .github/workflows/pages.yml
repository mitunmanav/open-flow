name: pages

# Publishes website/ to GitHub Pages.
#
# website/ is four hand-written HTML pages, a stylesheet, two scripts and two
# self-hosted webfonts. There is no generator and no build step: this workflow
# uploads the directory and GitHub serves it as-is. Every internal link is
# relative, so the site works unchanged whether it is served from
# mitunmanav.github.io or from a custom domain later.
#
# The workflow used to probe for website/ and skip the deploy when it was
# absent. That probe is gone because the directory now exists — a conditional
# that can never be false is a stale promise. See ticket 26.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deploy: a half-published site is worse than a
# slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Required even though nothing is compiled. It enables Pages for the
      # repository, authenticates the deployment, and exports base_path for
      # project sites. Without it `deploy-pages` fails with a 404 — the site is
      # built and never published.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website

  deploy:
    name: Deploy to Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
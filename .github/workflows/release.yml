name: release

# Tag-driven release. Produces a signed APK and AAB, publishes them to a GitHub
# Release with SHA-256 checksums, and refuses to publish anything unsigned.
#
# SIGNING SECRETS — set these as repository secrets before the first `v*` tag.
# They are named here and nowhere else, which is what makes this file the
# contract that ticket 18 fulfils:
#
#   OPENFLOW_KEYSTORE_BASE64   base64 of the upload keystore (.jks), no headers
#   OPENFLOW_KEYSTORE_PASSWORD keystore password
#   OPENFLOW_KEY_ALIAS        key alias inside the keystore
#   OPENFLOW_KEY_PASSWORD     key password
#
# A missing secret fails the job loudly. A release that silently shipped an
# unsigned or debug-signed APK would be worse than no release at all.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild a release for'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Tag and secrets
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve tag
        id: meta
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
            git fetch --tags --depth=1
            git checkout "refs/tags/$tag"
          else
            tag="$REF_NAME"
          fi

          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$tag' is not a semver tag (expected vMAJOR.MINOR.PATCH[-prerelease])."
            exit 1
          fi

          missing=()
          for secret in OPENFLOW_KEYSTORE_BASE64 OPENFLOW_KEYSTORE_PASSWORD \
                        OPENFLOW_KEY_ALIAS OPENFLOW_KEY_PASSWORD; do
            [ -n "${!secret:-}" ] || missing+=("$secret")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing signing secret(s): ${missing[*]}"
            echo "Set them as repository secrets before tagging. See .github/workflows/release.yml."
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Signed build
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.OPENFLOW_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keystore"
          # base64 -d rejects a wrongly-encoded secret; better to fail here than
          # to hand Gradle a corrupt keystore and sign nothing.
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/keystore/upload.jks"
          test -s "$RUNNER_TEMP/keystore/upload.jks" || {
            echo "::error::Decoded keystore is empty."
            exit 1
          }
          echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore/upload.jks" >> "$GITHUB_ENV"

      - name: Write signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.OPENFLOW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OPENFLOW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OPENFLOW_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/keystore/signing.properties" <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Tests
        run: ./gradlew --no-daemon test

      - name: Assemble signed APK and AAB
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify the APK is signed with the release key
        # Proves the build consumed the keystore rather than silently falling
        # back to the debug key, which is the failure this step exists to catch.
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$apk" || { echo "::error::No release APK produced."; exit 1; }
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$apksigner" || { echo "::error::apksigner not found."; exit 1; }
          "$apksigner" verify --print-certs "$apk" \
            || { echo "::error::Release APK is not signed."; exit 1; }

      - name: Checksum
        run: |
          set -euo pipefail
          mkdir -p app/build/outputs
          ( cd app/build/outputs && find . -type f \( -name '*.apk' -o -name '*.aab' \) -print0 \
            | xargs -0 sha256sum ) | tee app/build/outputs/checksums.txt
          {
            echo '## SHA-256 checksums'
            echo
            echo '```'
            cat app/build/outputs/checksums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk-aab-${{ needs.verify.outputs.tag }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/checksums.txt
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          generate_release_notes: true
          body_path: app/build/outputs/checksums.txt
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/checksums.txt
          fail_on_unmatched_files: true

      - name: Clean up keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/keystore"
<!doctype html>
<!--
  PROTOTYPE — throwaway.

  Question: what should OpenFlow's PERMISSIONS PAGE look and feel like?
  This is a permissions page. It is not a product demo, and it is not dressed up
  as one. Four grants, stated plainly, and a promise the user can hold us to.

  Design language: brutalism. Zero radius, no shadows, flat ground, one accent,
  structure doing the work instead of decoration.

  - The hero is the STATE OF THE FOUR GRANTS, set large enough to feel. A real
    odometer, spring-driven, because it is the one thing on this page that changes.
  - Every radius is 0 and every shadow is gone. The panel is a hard-edged object.
  - Each permission states what it touches AND what it cannot do. The limit clause
    is set in mono against the capability clause in the UI face: the honesty half
    of the line looks mechanically different from the marketing half, on purpose.
  - "Granted" is the row's own perimeter drawing itself clockwise (conic mask),
    not a bar bolted to the side. The row's outline arriving IS the state.
  - Motion is smooth but decisive. Press feedback snaps instantly — brutalism
    should not feel floaty. Exactly one celebratory overshoot (the odometer).
  - Dark and light both authored. Motion / transparency / contrast all respected.
  - Material 3: rows are 76px, past the 48dp floor. Dynamic colour deliberately
    unused — a dictation app's accent should not shift with the wallpaper.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenFlow — permissions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   Tokens. Flat ground, no elevation. Brutalism does not do tonal.
   ══════════════════════════════════════════════════════════════ */
:root {
  --ground:  #F4F4F2;
  --ink:     #0A0A0A;
  --mid:     #4A4A48;
  --low:     #6E6E6B;
  --rule:    rgba(10,10,10,.16);
  --rule-hi: rgba(10,10,10,.34);
  --bar:     rgba(10,10,10,.14);
  --accent: #5B21D6;   /* electric violet — 7.24:1 on paper, AA for text */
  --on-accent: #FFFFFF;
  --field:   rgba(10,10,10,.05);
  --font-mega: "Archivo", system-ui, sans-serif;
  --font-ui:   "Archivo", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
}
:root[data-theme="dark"] {
  --ground:  #0A0A0A;
  --ink:     #F4F4F2;
  --mid:     #B4B4B0;
  --low:     #8E8E8A;
  --rule:    rgba(244,244,242,.18);
  --rule-hi: rgba(244,244,242,.4);
  --bar:     rgba(244,244,242,.16);
  --accent: #A78BFA;   /* lifted for black — 7.27:1, AA for text */
  --on-accent: #0A0A0A;
  --field:   rgba(244,244,242,.06);
}

* { box-sizing: border-box; border-radius: 0; }   /* brutalism: no soft edges, anywhere */
html, body { margin: 0; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  transition: background .2s linear, color .2s linear;
}

.stage { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px 72px; }
.sheet { width: 430px; max-width: 100%; border: 2px solid var(--ink); background: var(--ground); }

/* ── top rail: structural, mono, thin ── */
.rail {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px; border-bottom: 2px solid var(--ink);
  font-family: var(--font-mono); font-size: 12px; letter-spacing: .01em;
}
.rail .brand { font-family: var(--font-ui); font-weight: 800; font-size: 14px; letter-spacing: -.02em; }
.rail .sep { color: var(--low); }
.rail .grow { flex: 1; }
.rail button {
  width: 34px; height: 34px; display: grid; place-items: center;
  background: transparent; border: 1px solid var(--rule-hi); color: var(--ink);
  cursor: pointer; transition: background .1s linear;
}
.rail button:hover { background: var(--field); }
.rail button:active { background: var(--ink); color: var(--ground); }
.rail button svg { display: block; }

/* ══════════════════════════════════════════════════════════════
   The hero: the state of the four grants, at scale. Odometer.
   line-height 1 so each digit's 1em box is exactly the numeral's box — the
   strip can then be translated by whole ems and land dead on the baseline.
   ══════════════════════════════════════════════════════════════ */
.hero { padding: 26px 18px 22px; display: flex; align-items: flex-end; gap: 18px; }
.odo { display: block; height: 1em; overflow: hidden; }
.odo-strip { display: block; will-change: transform; }
.odo-strip i { display: block; height: 1em; line-height: 1; font-style: normal; }
.hero .num {
  font-family: var(--font-mega); font-weight: 800;
  font-size: 116px; line-height: 1; letter-spacing: -.05em;
  font-variant-numeric: tabular-nums;
}
.hero .of { padding-bottom: 8px; }
.hero .of .l2 { font-family: var(--font-mono); font-size: 12px; color: var(--low); }

/* ══════════════════════════════════════════════════════════════
   The four asks. Hard rows, hairline rules, 4px left bar = state.
   ══════════════════════════════════════════════════════════════ */
.list { margin: 0; padding: 0; list-style: none; border-top: 2px solid var(--ink); }
.row {
  display: grid; grid-template-columns: 1fr auto; align-items: baseline;
  gap: 2px 12px;
  min-height: 76px;                      /* past the 48dp floor */
  padding: 15px 14px 15px 18px;
  border-bottom: 1px solid var(--rule);
  position: relative; cursor: pointer;
  transition: background .1s linear;
}
.row:hover { background: var(--field); }
.row.pressed { background: var(--field); }
/* THE STATE MARK: the row's OWN perimeter draws itself, clockwise from the top.
   A conic-gradient mask sweeps the border; the interior stays transparent, so
   nothing can ever paint over the row's text. --sweep is a real angle written
   from JS each frame: 0deg invisible, 360deg the full ring. */
.row::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  border: 2px solid var(--accent);
  -webkit-mask-image: conic-gradient(from -90deg, #000 0 var(--sweep, 0deg), transparent var(--sweep, 0deg) 360deg);
          mask-image: conic-gradient(from -90deg, #000 0 var(--sweep, 0deg), transparent var(--sweep, 0deg) 360deg);
  will-change: mask-image;
}

.row .name { grid-column: 1; font-weight: 700; font-size: 17px; letter-spacing: -.02em; }
.row .state {
  grid-column: 2; font-family: var(--font-mono); font-size: 11.5px;
  letter-spacing: .02em; color: var(--low); text-transform: lowercase;
}
.row[data-on="1"] .state { color: var(--accent); }
/* the capability clause: human voice */
.row .does { grid-column: 1 / span 2; font-size: 14.5px; color: var(--mid); margin-top: 2px; }
/* the limit clause: machine voice. The honesty half, and it looks it. */
.row .nots {
  grid-column: 1 / span 2;
  font-family: var(--font-mono); font-size: 12px; color: var(--low);
  margin-top: 5px; letter-spacing: -.01em;
}
.row .meter { grid-column: 1 / span 2; height: 3px; background: var(--bar); margin-top: 9px; }
.row .meter i { display: block; height: 100%; background: var(--accent); width: 100%; transform: scaleX(0); transform-origin: left; }

/* ══════════════════════════════════════════════════════════════
   Foot
   ══════════════════════════════════════════════════════════════ */
.foot { padding: 18px 14px 20px; }
.cta {
  width: 100%; padding: 17px;
  background: var(--ink); color: var(--ground);
  border: 2px solid var(--ink);
  font-family: var(--font-ui); font-weight: 700; font-size: 16px; letter-spacing: -.015em;
  cursor: pointer;
  transition: background .1s linear, color .1s linear, transform .06s ease-out;
}
.cta:hover { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.cta:active { transform: scale(.985); }
/* the live state: all four granted, this is now the go action */
.cta.ready { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.cta.ready:hover { background: var(--ink); border-color: var(--ink); color: var(--ground); }
.promise {
  margin: 16px 0 0; font-family: var(--font-mono); font-size: 11.5px;
  line-height: 1.7; color: var(--low);
}
.promise b { color: var(--ink); font-weight: 500; }

/* ── prototype chrome ── */
.tools {
  position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
  display: flex; gap: 2px; align-items: center;
  background: var(--ink); color: var(--ground);
  padding: 4px 5px; border: 1px solid var(--ink);
  font-family: var(--font-mono); font-size: 11px; z-index: 9;
}
:root[data-theme="dark"] .tools { background: var(--ground); color: var(--ink); border-color: var(--ground); }
.tools button { background: transparent; border: 0; color: inherit; cursor: pointer; padding: 6px 10px; font-family: var(--font-mono); font-size: 11px; }
.tools button:hover { background: rgba(140,140,140,.25); }
.tools button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

/* ── respect the reader ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  .cta:active { transform: none; }
  .odo { overflow: visible; }
}
@media (prefers-contrast: more) {
  :root { --rule: currentColor; --rule-hi: currentColor; --bar: currentColor; }
  .row, .sheet, .cta { border-width: 3px; }
}
@media (max-width: 462px) {
  .stage { padding: 0; }
  .sheet { width: 100%; border-left: 0; border-right: 0; }
}
</style>
</head>
<body>

<div class="stage">
  <div class="sheet">

    <div class="rail">
      <span class="brand">OpenFlow</span>
      <span class="sep">/</span>
      <span>permissions</span>
      <span class="grow"></span>
      <button id="theme" aria-label="Change theme"></button>
    </div>

    <div class="hero">
      <div class="num" aria-hidden="true"><span class="odo"><span class="odo-strip" id="odoStrip"><i>0</i><i>1</i><i>2</i><i>3</i><i>4</i></span></span></div>
      <div class="of">
        <div class="l2" id="ofL2">nothing granted yet</div>
      </div>
    </div>

    <ol class="list" id="list"></ol>

    <div class="foot">
      <button class="cta" id="go">Grant all four</button>
      <p class="promise">
        <b>Four asks, and that is all.</b> No location, contacts, photos, or network.
        Audio is deleted the moment it becomes text.
      </p>
    </div>

  </div>
</div>

<div class="tools">
  <button id="t-light" aria-pressed="false">light</button>
  <button id="t-dark" aria-pressed="false">dark</button>
  <button id="t-auto" aria-pressed="true">auto</button>
  <button id="t-reset">reset</button>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   The four asks. Each states what it touches, and what it cannot do.
   ══════════════════════════════════════════════════════════════ */
const ASKS = [
  { id:'mic',    name:'Microphone',  does:'hears you while you hold it', nots:'silent otherwise' },
  { id:'overlay',name:'Bubble',      does:'one circle over your apps', nots:'cannot see inside them' },
  { id:'a11y',   name:'Dictation',   does:'reads the box you type in',  nots:'nothing else on screen' },
  { id:'model',  name:'Voice model', does:'45 MB once, then offline',   nots:'never uploaded', bytes:true },
];
const P = { mic:false, overlay:false, a11y:false, model:false };
const $ = s => document.querySelector(s);
const nDone = () => ASKS.filter(a => P[a.id]).length;

/* ══════════════════════════════════════════════════════════════
   Spring — no fixed duration, re-targetable mid-flight from its
   current value. That is what makes it interruptible.
   ══════════════════════════════════════════════════════════════ */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)');
class Spring {
  constructor(x, response = .3, zeta = 1) {
    this.x = x; this.v = 0; this.to = x; this.r = response; this.z = zeta;
  }
  set(to) { this.to = to; }
  kick(dv) { this.v += dv; }
  step(dt) {
    if (REDUCED.matches) { this.x = this.to; this.v = 0; return this.x; }
    const w = 2 * Math.PI / this.r, k = w * w, c = 2 * this.z * w;
    this.v += (-k * (this.x - this.to) - c * this.v) * dt;
    this.x += this.v * dt;
    return this.x;
  }
}
/* the odometer. zeta .88 — the one celebratory overshoot on the page. */
const odo = new Spring(0, .42, .88);
/* each row's state bar and the model's meter wipe on their own springs,
   so a grant is a physical wipe rather than a CSS transition. */
const wipes = ASKS.map(() => new Spring(0, .34));
const fillS = new Spring(0, .42);

let raf = null, last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 60); last = now;
  odo.step(dt);
  let busy = Math.abs(odo.x - odo.to) > .0005 || Math.abs(odo.v) > .0005;

  wipes.forEach((s, i) => {
    const on = P[ASKS[i].id] ? 1 : 0;
    s.set(on);
    s.step(dt);
    const w = Math.max(0, Math.min(1, s.x));
    const row = document.querySelector(`[data-ask="${ASKS[i].id}"]`);
    if (row) row.style.setProperty('--sweep', (w * 360).toFixed(1) + 'deg');
    if (Math.abs(s.x - s.to) > .0005 || Math.abs(s.v) > .0005) busy = true;
  });

  fillS.set(P.model ? 1 : 0);
  fillS.step(dt);
  const meter = document.querySelector('[data-meter]');
  if (meter) meter.style.transform = `scaleX(${Math.max(0, Math.min(1, fillS.x)).toFixed(4)})`;
  if (Math.abs(fillS.x - fillS.to) > .0005 || Math.abs(fillS.v) > .0005) busy = true;

  $('#odoStrip').style.transform = `translateY(${(-odo.x).toFixed(4)}em)`;
  if (busy) raf = requestAnimationFrame(frame); else raf = null;
}
function wake() { if (raf === null) { last = performance.now(); raf = requestAnimationFrame(frame); } }
function buzz(ms) { if (navigator.vibrate) try { navigator.vibrate(ms); } catch (_) {} }

/* ══════════════════════════════════════════════════════════════
   Theme
   ══════════════════════════════════════════════════════════════ */
const SUN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
const MOON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M20 14.4A8.4 8.4 0 0 1 9.6 4a8.4 8.4 0 1 0 10.4 10.4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>';

function setTheme(mode) {
  const root = document.documentElement;
  if (mode === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', mode);
  const dark = mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  $('#theme').innerHTML = dark ? SUN : MOON;
  for (const m of ['light','dark','auto']) $('#t-' + m).setAttribute('aria-pressed', String(m === mode));
}
$('#theme').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme') || 'auto';
  setTheme(cur === 'dark' ? 'light' : cur === 'light' ? 'auto' : 'dark');
  buzz(5);
});
for (const m of ['light','dark','auto']) $('#t-' + m).addEventListener('click', () => setTheme(m));
$('#t-reset').addEventListener('click', () => {
  ASKS.forEach(a => P[a.id] = false);
  odo.set(0); render(); buzz(5);
});

/* ══════════════════════════════════════════════════════════════
   Render
   ══════════════════════════════════════════════════════════════ */
function render() {
  const n = nDone(), all = n === ASKS.length, left = ASKS.length - n;
  odo.set(n);
  /* The numeral already says the count, so the status line says what is LEFT and
     the two work together instead of repeating each other. Indexed by `left`. */
  const LEFT = ['all four granted', 'three left to grant', 'two left to grant', 'one left to grant', 'nothing granted yet'];
  $('#ofL2').textContent = LEFT[left];

  $('#list').innerHTML = ASKS.map((a, i) => `
    <li class="row" role="button" tabindex="0" data-ask="${a.id}" data-on="${P[a.id] ? 1 : 0}"
        aria-pressed="${P[a.id]}" aria-label="${a.name}: ${a.does}, ${a.nots}">
      <span class="name">${a.name}</span>
      <span class="state">${P[a.id] ? 'on' : 'needed'}</span>
      <span class="does">${a.does}</span>
      <span class="nots">${a.nots}</span>
      ${a.bytes ? `<span class="meter"><i data-meter></i></span>` : ''}
    </li>`).join('');

  const go = $('#go');
  go.textContent = all ? 'Start dictating' : n ? 'Grant the rest' : 'Grant all four';
  /* never disabled: once all four are granted this is the live action, so it
     fills with the accent instead of greying out. Dead UI is worse than no UI. */
  go.classList.toggle('ready', all);
  wake();
}

function toggle(id) {
  const to = !P[id];
  P[id] = to;
  if (id === 'model') fillS.kick(to ? 2 : -2);
  if (to && nDone() === ASKS.length) { buzz([8, 30, 14, 30, 18]); odo.kick(2.4); }
  else buzz(to ? [6, 22, 9] : 4);
  render();
}

/* ── rows: instant press feedback, no easing. Brutalism is abrupt. ── */
$('#list').addEventListener('pointerdown', e => {
  const row = e.target.closest('.row'); if (row) row.classList.add('pressed');
});
const unpress = e => {
  const row = e.target.closest('.row'); if (row) row.classList.remove('pressed');
};
$('#list').addEventListener('pointerup', unpress);
$('#list').addEventListener('pointercancel', unpress);
$('#list').addEventListener('pointerleave', unpress);
$('#list').addEventListener('click', e => {
  const row = e.target.closest('.row'); if (row) toggle(row.dataset.ask);
});
$('#list').addEventListener('keydown', e => {
  const row = e.target.closest('.row');
  if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggle(row.dataset.ask); }
});

$('#go').addEventListener('click', () => {
  /* all four granted -> this is the live action. In the app it opens the bubble;
     here it says so, rather than silently doing nothing. */
  if (nDone() === ASKS.length) {
    buzz([10, 40, 18]);
    $('#ofL2').textContent = 'bubble would open here';
    return;
  }
  buzz([8, 30, 14, 30, 18]);
  ASKS.forEach(a => P[a.id] = true);
  fillS.kick(2.4); odo.kick(2.4);
  render();
});

addEventListener('resize', wake);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (!document.documentElement.getAttribute('data-theme')) setTheme('auto');
});
REDUCED.addEventListener('change', wake);

setTheme('auto');
render();
</script>
</body>
</html>

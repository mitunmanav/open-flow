# Gradle
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is non-optional. The sherpa-onnx AAR declares androidx as
# `implementation`, so nothing androidx is transitive through it — every module
# states what it actually uses.
android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Model binaries are NEVER fetched by a build. The V1 ASR model is ~43 MB and the
# VAD model ~0.6 MB; they are runtime assets, resolved from their upstream hosts by
# the app, and a build must stay able to run on a machine with no model cache. ADR-0007.
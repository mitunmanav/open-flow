name: Bug
description: Something broke
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do **not** paste dictation, bank screens, names, emails, or phone numbers.
  - type: checkboxes
    id: no_personal
    attributes:
      label: This report is clean
      options:
        - label: I did not paste personal dictation, bank screens, or contact details
          required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you tapped and what you expected. A cropped screenshot of the app UI helps.
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone
      placeholder: e.g. Pixel, Android 15
  - type: input
    id: ver
    attributes:
      label: Open Flow version
      placeholder: 0.1.7

title: "[idea] "
category: ideas
body:
  - type: markdown
    attributes:
      value: |
        Feature ideas. Bugs → [Issues](https://github.com/mitunmanav/open-flow/issues/new/choose).
        Do **not** post names, emails, bank screens, or private dictation.
  - type: checkboxes
    id: no_personal
    attributes:
      label: This post is clean
      options:
        - label: I did not paste personal dictation, bank screens, or contact details
          required: true
  - type: textarea
    id: idea
    attributes:
      label: What do you want
    validations:
      required: true

name: dependency-review

# Blocks a pull request that introduces a known-vulnerable or deprecated
# dependency. Advisory-driven, so it costs nothing on a repo that currently has
# no build manifest — it simply reports nothing until there is a lockfile.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
name: Idea
description: A change or new feature
title: "[idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas can also go in [Discussions](https://github.com/mitunmanav/open-flow/discussions). No personal information.
  - type: checkboxes
    id: no_personal
    attributes:
      label: This idea is clean
      options:
        - label: I did not paste personal dictation, bank screens, or contact details
          required: true
  - type: textarea
    id: idea
    attributes:
      label: What do you want
      description: Plain words.
    validations:
      required: true

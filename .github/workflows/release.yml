name: Release notes

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Extract changelog section
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk "/^## ${V}\b/{f=1;next} /^## /{f=0} f" CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::No CHANGELOG section for ${V}; using fallback text"
            echo "Release ${GITHUB_REF_NAME}" > notes.md
          fi
          cat notes.md

      - name: Build release AAB + APK + mapping
        run: |
          ./gradlew :app:bundleRelease :app:assembleRelease --console=plain
          ls -lh app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/mapping/release/mapping.txt || true
          bash scripts/qa/play-check.sh

      - name: Rename artifacts with version
        run: |
          V="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/bundle/release/app-release.aab "openflow-${V}.aab"
          cp app/build/outputs/apk/release/app-release.apk "openflow-${V}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "mapping-${V}.txt" 2>/dev/null || echo "no mapping"
          ls -lh openflow-* mapping-* || true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            openflow-*.aab
            openflow-*.apk
            mapping-*.txt
          make_latest: true
          fail_on_unmatched_files: false

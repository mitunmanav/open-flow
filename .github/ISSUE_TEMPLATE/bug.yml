name: Bug
description: Something broke
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you tapped and what you expected. A screenshot helps.
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone
      placeholder: e.g. Nothing A059, Android 15
  - type: input
    id: ver
    attributes:
      label: Open Flow version
      placeholder: 0.1.5
